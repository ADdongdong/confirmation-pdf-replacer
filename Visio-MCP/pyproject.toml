[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "visio-mcp-server"
version = "2.0.0"
description = "MCP server for Microsoft Visio automation via COM"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pywin32>=306",
]

[project.scripts]
visio-mcp = "visio_server.app:run_server"

[tool.setuptools.packages.find]
include = ["visio_server*"]
