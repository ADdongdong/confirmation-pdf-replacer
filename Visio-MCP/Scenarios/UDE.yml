  - kind: GptComponent
    version: 14954265
    managedProperties:
      isCustomizable: false
      solutionId: fd140aae-4df4-11dd-bd17-0019b9312238

    auditInfo:
      createdTimeUtc: 2025-12-10T23:10:40.0000000Z
      modifiedTimeUtc: 2025-12-11T23:22:48.0000000Z
      createdBy: 7e85cdac-f0d5-4d2d-bc7b-3f77b670264b
