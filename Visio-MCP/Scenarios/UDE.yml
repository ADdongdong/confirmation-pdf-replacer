connectorDefinitions:
  - connectorId: /providers/Microsoft.PowerApps/apis/shared_debug-20analyzer-20api-5fbc53b16f63b6e5fe-5fd0a953abffa29fb4
    version: 639010947654219600
    displayName: Debug Analyzer API
    description: API for AI-assisted process or kernel dump analysis.
    isCustom: true
    connectorType: Environment
    iconUri: https://prodapiicons.cdn.powerappscdn.net/20251209t000000zffc9e8f3a2cc461a89e86e259b87fe2b/customconnectoricon.png
    changedTime: 2025-12-12T00:06:05.4219589Z
    hasPublicData: true
    isSSOSupported: false
    operations:
      - displayName: Health check
        description: Confirms the health and availability of the API service
        outputType: String
        operationId: Health_Check

      - displayName: Analyze a crash/perf dump
        description: Invoke AnalyzeDump
        inputType:
          properties:
            context:
              order: 2
              type: String

            dumpPath:
              isRequired: true
              order: 0
              type: String

            maxSteps:
              order: 3
              type: Number

            mode:
              description: Analysis mode
              order: 1
              enumValues:
                - Crash
                - Hang
                - HighCpu
                - HighMemory
                - SlowPerformance
                - ResourceExhaustion
                - StartupFailure
                - ShutdownFailure
                - Deadlock
                - AutoTriage
              type: String

        outputType:
          kind: Record
          properties:
            history:
              isRequired: true
              order: 2
              type:
                kind: Table
                properties:
                  command:
                    isRequired: true
                    order: 1
                    type: String

                  isError:
                    isRequired: true
                    order: 4
                    type: Boolean

                  outputSummary:
                    isRequired: true
                    order: 2
                    type: String

                  stepName:
                    isRequired: true
                    order: 0
                    type: String

                  timedOut:
                    isRequired: true
                    order: 3
                    type: Boolean

            limitations:
              isRequired: true
              order: 3
              type:
                kind: Table
                properties:
                  Value: String

            mode:
              isRequired: true
              order: 0
              type: String

            stepCount:
              isRequired: true
              order: 1
              type: Number

        operationId: Analyze_Dump

      - displayName: Get status and, when complete, the analysis result for a job
        description: Invoke GetAnalysisJob
        inputType:
          properties:
            jobId:
              isRequired: true
              order: 0
              type: String

        outputType:
          kind: Record
          properties:
            error:
              order: 3
              type: String

            jobId:
              isRequired: true
              order: 0
              type: String

            result:
              order: 2
              type:
                kind: Record
                properties:
                  history:
                    order: 2
                    type:
                      kind: Table
                      properties:
                        command:
                          order: 1
                          type: String

                        isError:
                          order: 4
                          type: Boolean

                        outputSummary:
                          order: 2
                          type: String

                        stepName:
                          order: 0
                          type: String

                        timedOut:
                          order: 3
                          type: Boolean

                  limitations:
                    order: 3
                    type:
                      kind: Table
                      properties:
                        Value: String

                  mode:
                    order: 0
                    type: String

                  stepCount:
                    order: 1
                    type: Number

            status:
              isRequired: true
              order: 1
              type: String

        operationId: Get_Analysis_Job